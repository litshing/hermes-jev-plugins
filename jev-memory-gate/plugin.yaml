name: jev-memory-gate
version: 0.1.0
description: >
  A Jev judgement in front of the `memory` tool. Asks TypeSafe's Jev model
  whether a candidate entry is worth carrying across sessions — durable,
  non-obvious and steering-reducing — and declines the write when it is
  confidently filler. Permanent memory is injected into every future
  conversation, so a wasted entry is a permanent tax. Conservative and
  fail-open: only a confident rejection blocks, and any error, missing key or
  timeout lets the write proceed untouched. Reads are never judged.
author: Shing
kind: standalone
capabilities:
  # Required to be effective. The gate declines a write by short-circuiting the
  # `memory` tool call (it returns a tool result instead of calling next_call),
  # and the host only permits that with this capability granted. Without it the
  # plugin still loads and still judges, but every decline is refused by the
  # host — logged as `capability=tools.override decision=deny ... evidence=not
  # granted` — so it silently fails open. Grant with the consent flow
  # (`hermes plugins update jev-memory-gate`, interactive Y/n) or directly:
  #   plugins.entries.jev-memory-gate.granted_capabilities: [tools.override]
  # (deprecated equivalent: allow_tool_override: true)
  - tools.override
requires_env:
  - name: TYPESAFE_API_KEY
    description: "TypeSafe API key (System One / jev-latest)"
    prompt: "TypeSafe API key"
    url: "https://typesafe.ai/"
    password: true
